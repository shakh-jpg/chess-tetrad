# Keeps the free Supabase project awake: free projects are paused after ~7 days without activity.
# Calls the public ping() function with the anon key three times a week. Free (GitHub Actions minutes).
# Note: GitHub disables scheduled workflows in a repository with no commits for 60 days;
# GitHub sends an e-mail, and the workflow can be re-enabled on the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 5 * * 1,3,5'   # Mon, Wed, Fri at 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Cloud is not configured (no repository variables) - nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
