# Safari's engine (students on iPhones). A separate workflow on purpose: installing WebKit on
# the runner sometimes hangs, and a hung or failed run here must never block the deploy
# (deploy.yml waits only for the "CI" workflow). Failures still show up in the Actions tab.
name: WebKit (Safari) e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit for Playwright
        timeout-minutes: 15
        run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npm run e2e:webkit
